name: Uzhavan Express weekly availability

on:
  schedule:
    # Mondays 09:00 IST (03:30 UTC)
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check train availability
        env:
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAILRADAR_MONTHLY_LIMIT: ${{ vars.RAILRADAR_MONTHLY_LIMIT }}
          TRAIN_CLASS_CODE: SL
          TRAIN_QUOTA_CODE: GN
        run: python train_alert.py
      - name: Persist usage counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage.json
          if ! git diff --cached --quiet; then
            git commit -m "Update RailRadar usage counter"
            git push
          fi
